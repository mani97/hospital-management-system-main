spring.application.name=spring-security

# ===============================
# Database
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# ===============================
# Server
# ===============================
server.port=${PORT:9098}

# ===============================
# Gmail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Pharmacy Module
# ===============================
pharmacy.alert.email=${PHARMACY_ALERT_EMAIL:}
pharmacy.expiry.warning-days=30
pharmacy.expiry.cron=0 0 8 * * *

# ===============================
# WhatsApp (Twilio)
# ===============================
pharmacy.whatsapp.enabled=${TWILIO_ENABLED:false}
pharmacy.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
pharmacy.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
pharmacy.whatsapp.twilio.from=${TWILIO_FROM:whatsapp:+14155238886}
pharmacy.whatsapp.default-country-code=+91
